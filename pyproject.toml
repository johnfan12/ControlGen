[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlgen"
version = "0.1.0"
description = "Control structure to time-series dataset generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[project.scripts]
controlgen = "controlgen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["controlgen*"]
